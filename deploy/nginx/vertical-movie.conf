# Without Docker, if you prefer nginx over Caddy. Obtain the certificate first:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d movies.example.com
# Save as /etc/nginx/sites-available/vertical-movie.conf, link it into sites-enabled, then
#   sudo nginx -t && sudo systemctl reload nginx
# Replace movies.example.com. Uploads go straight to the object storage, so no large body limit is needed.
server {
    listen 80;
    listen [::]:80;
    server_name movies.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name movies.example.com;

    ssl_certificate     /etc/letsencrypt/live/movies.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movies.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
