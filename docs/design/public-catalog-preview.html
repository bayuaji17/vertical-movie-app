      const label = (item) => (item.kind === "movie" ? "Film" : "Standalone");
      const length = (item) => `${Math.ceil(item.durationMs / 60000)} min`;
      function poster(item, failed, canRetry = false) {
        return `<div class="poster">${failed ? `<div class="fallback"><span aria-hidden="true">▧</span>Cover unavailable${canRetry ? '<button data-action="retry">Retry cover</button>' : ""}</div>` : `<img src="${escape(item.poster)}" alt="${escape(item.title)} cover" loading="lazy" width="900" height="1600">`}</div>`;
      }
      function notice(text, action = "Retry") {
        return `<div class="notice" role="status"><p>${escape(text)}</p><button data-action="retry">${escape(action)}</button></div>`;
      }
      function empty(title, text, action = "Back to browse") {
        return `<section class="empty"><div class="symbol" aria-hidden="true">◇</div><h2>${escape(title)}</h2><p class="muted">${escape(text)}</p><button data-action="${action === "Retry" ? "retry" : "browse"}">${escape(action)}</button></section>`;
      }
      function skeleton() {
        return '<div aria-hidden="true"><div class="poster skeleton"></div><div class="line"></div><div class="line short"></div></div>';
      }
      function render() {
        const values = Object.fromEntries(
          controls.map((id) => [id, document.getElementById(id).value]),
        );
        const { theme, screen, state, viewport } = values;
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" ||
            (theme === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches),
        );
        document
          .querySelector(".viewport")
          .classList.toggle("mobile", viewport === "mobile");
        const item = fixtures[selected];
        const plannedRoute =
          screen === "home"
            ? `/?type=${type}`
            : `/${screen === "detail" ? "videos" : "watch"}/${item.slug}?type=${type}`;
        document.getElementById("route").textContent =
          "Planned URL: " + plannedRoute;
        history.replaceState(
          null,
          "",
          "?" + new URLSearchParams({ ...values, type }),
        );
        let html = `<header><a class="brand" href="#browse" data-action="browse"><b aria-hidden="true">▶</b>Vertical Movie</a><nav class="header-links" aria-label="Main"><a href="#browse" data-action="browse">Browse</a><button data-action="theme" aria-label="Change appearance">◐</button></nav></header><main>`;
        if (screen === "home") {
          html += `<h1>Browse</h1><p class="muted">Find your next story.</p><div class="filters" role="group" aria-label="Content type">${["all", "film", "standalone"].map((v) => `<button data-filter="${v}" aria-pressed="${v === type}">${v === "all" ? "All" : v === "film" ? "Films" : "Standalone"}</button>`).join("")}</div>`;
          const cards = fixtures
            .map((x, index) => ({ ...x, index }))
            .filter(
              (x) =>
                type === "all" ||
                (type === "film"
                  ? x.kind === "movie"
                  : x.kind === "standalone"),
            );
          if (state === "empty")
            html += empty(
              type === "all" ? "No videos yet" : "No videos in this category",
              "Check back soon for more stories.",
              "Browse all",
            );
          else if (state === "error")
            html += empty(
              "Could not load videos",
              "Check your connection and try again.",
              "Retry",
            );
          else {
            if (state === "stale")
              html += notice(
                "Showing previously loaded videos. Refresh to see the latest.",
                "Refresh",
              );
            if (state === "offline")
              html += notice(
                "You are offline. Reconnect to load more stories.",
                "Retry",
              );
            if (state === "cover-error")
              html += notice(
                "A cover could not be loaded. Video details are still available.",
                "Retry cover",
              );
            html += `<div class="grid" aria-busy="${state === "loading" || state === "more-loading"}">`;
            if (state === "loading")
              html += Array.from({ length: 10 }, skeleton).join("");
            else
              html += cards
                .map(
                  (x) =>
                    `<a class="card" href="#detail" data-item="${x.index}" aria-label="Open ${escape(x.title)} details">${poster(x, state === "cover-error" && x.index === 0)}<div class="card-title">${escape(x.title)}</div><div class="muted">${label(x)} · ${length(x)}</div></a>`,
                )
                .join("");
            if (state === "more-loading")
              html += Array.from({ length: 5 }, skeleton).join("");
            if (appended)
              html += `<a class="card" href="#detail" data-item="0">${poster(item, false)}<div class="card-title">One More Story</div><div class="muted">Film · 12 min</div></a>`;
            html += '</div><div class="pagination">';
            if (state === "more-error")
              html += notice(
                "More videos could not be loaded. Your current videos are still here.",
                "Retry load more",
              );
            html += `<button data-action="more" ${["loading", "more-loading", "offline"].includes(state) ? "disabled" : ""}>${state === "more-loading" ? "Loading…" : "Load more"}</button><small class="muted" role="status">${state === "loading" ? "Loading videos…" : `${cards.length + (appended ? 1 : 0)} videos shown`}</small></div>`;
          }
        } else if (state === "missing")
          html += empty(
            "Video unavailable",
            "This video is not available. Browse for another story.",
          );
        else if (state === "error")
          html += empty(
            "Could not load this video",
            "Check your connection and try again.",
            "Retry",
          );
        else if (state === "loading")
          html += `<a class="back" href="#browse" data-action="browse">← Back to browse</a><div class="detail">${skeleton()}<div><div class="line"></div><div class="line"></div></div></div><p role="status">Loading video…</p>`;
        else if (screen === "detail") {
          html += `<a class="back" href="#browse" data-action="browse">← Back to browse</a><section class="detail">${poster(item, state === "cover-error", true)}<div class="details"><h1>${escape(item.title)}</h1><div class="metadata"><span class="badge">${label(item)}</span><span class="muted">${length(item)}</span></div><h2>Synopsis</h2><p class="synopsis">${escape(item.synopsis)}</p>${state === "stale" ? notice("Showing previously loaded information.", "Refresh") : ""}${state === "offline" ? notice("You are offline. Reconnect to watch.", "Retry") : ""}<div class="actions"><button class="primary" data-action="watch" ${state === "offline" ? "disabled" : ""}>▶ Watch now</button></div></div></section>`;
        } else {
          html += `<section class="watch"><a class="back" href="#detail" data-action="detail">← Back to details</a><h1>${escape(item.title)}</h1><div class="metadata"><span class="badge">${label(item)}</span><span class="muted">${length(item)}</span></div><div class="stage">${state === "expired" ? '<h2>Playback interrupted</h2><p>Refresh playback to continue watching.</p><button data-action="retry">Retry playback</button>' : state === "offline" ? '<h2>You are offline</h2><p>Reconnect and try again.</p><button data-action="retry">Retry</button>' : '<button class="primary" aria-label="Play video" data-action="play">▶ Play</button><p>Ready to watch</p>'}</div></section>`;
        }
        html += "</main>";
        document.getElementById("product").innerHTML = html;
      }
      document.getElementById("product").addEventListener("click", (event) => {
        const target = event.target.closest(
          "[data-filter], [data-item], [data-action]",
        );
        if (!target || target.disabled) return;
        event.preventDefault();
        const action = target.dataset.action;
        if (target.dataset.filter) {
          type = target.dataset.filter;
          appended = false;
          document.getElementById("state").value = "ready";
        }
        if (target.dataset.item) {
          selected = Number(target.dataset.item);
          document.getElementById("screen").value = "detail";
        }
        if (["browse", "detail", "watch"].includes(action)) {
          document.getElementById("screen").value =
            action === "browse" ? "home" : action;
          document.getElementById("state").value = "ready";
          if (action === "browse" && target.textContent === "Browse all")
            type = "all";
        }
        if (action === "retry")
          document.getElementById("state").value = "ready";
        if (action === "more") appended = true;
        if (action === "theme")
          document.getElementById("theme").value =
            document.documentElement.classList.contains("dark")
              ? "light"
              : "dark";
        if (action === "play")
          document.getElementById("state").value = "expired";
        render();
        if (
          ["browse", "detail", "watch"].includes(action) ||
          target.dataset.item
        )
          document.querySelector(".viewport").scrollTop = 0;
        if (
          ["browse", "detail", "watch"].includes(action) ||
          target.dataset.item
        ) {
          const focus =
            action === "browse"
              ? document.querySelector(`[data-item="${selected}"]`)
              : document.querySelector("#product h1, #product h2");
          if (focus) {
            if (!focus.matches("a, button")) focus.tabIndex = -1;
            focus.focus({ preventScroll: true });
          }
        }
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener(
        "change",
        render,
      );
      render();
    </script>
  </body>
</html>
